name: gates

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structure:
    name: structure and prose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Structural gate
        run: python3 tools/check-structure.py
      - name: Prose gate
        run: python3 tools/check-prose.py
      - name: Indexes are current
        run: |
          python3 tools/gen-indexes.py
          git diff --exit-code -- patterns || {
            echo "Family indexes are stale. Run tools/gen-indexes.py and commit."
            exit 1
          }
      - name: Catalogue status generator tests
        run: python3 tools/gen-catalogue-status-test.py
      - name: Catalogue status is current
        run: |
          python3 tools/gen-catalogue-status.py
          git diff --exit-code -- README.md docs/PROGRESS.md dist/ || {
            echo "Catalogue status is stale. Run tools/gen-catalogue-status.py and commit."
            exit 1
          }

  code:
    name: code samples compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.23"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Compile every sample
        run: python3 tools/check-code.py --strict

  citations:
    name: citations resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Probe every cited URL
        run: python3 tools/validate-refs.py --strict --timeout 25

  markdown:
    name: markdown style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: markdownlint-cli2
        run: npx --yes markdownlint-cli2@0.23.2
