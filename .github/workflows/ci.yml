name: gates

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structure:
    name: structure and prose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Structural gate
        run: python3 tools/check-structure.py
      - name: Prose gate
        run: python3 tools/check-prose.py
      - name: Indexes are current
        run: |
          python3 tools/gen-indexes.py
          git diff --exit-code -- patterns || {
            echo "Family indexes are stale. Run tools/gen-indexes.py and commit."
            exit 1
          }
      - name: Catalogue status generator tests
        run: python3 tools/gen-catalogue-status-test.py
      - name: Catalogue status is current
        run: |
          python3 tools/gen-catalogue-status.py
          git diff --exit-code -- README.md docs/PROGRESS.md dist/ || {
            echo "Catalogue status is stale. Run tools/gen-catalogue-status.py and commit."
            exit 1
          }

  code:
    name: code samples compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.23"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Compile every sample
        run: python3 tools/check-code.py --strict

  citations:
    name: citations resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Probe every cited URL
        run: python3 tools/validate-refs.py --strict --timeout 25

  markdown:
    name: markdown style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: markdownlint-cli2
        run: npx --yes markdownlint-cli2@0.23.2

  claims:
    name: claim check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Fetch main for comparison
        run: git fetch origin main --depth=200
      - name: No two contributors on the same entry
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }} # BESTPRACTICE_OK: numeric field via env, never inlined into run:
          BASE_SHA: origin/main
        run: python3 tools/check-claims.py
