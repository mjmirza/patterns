name: refresh-citations

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# contents: write pushes automation/refresh-citations.
# pull-requests: write opens or updates that pull request.
# main stays protected. Nothing in this workflow pushes to it.
#
# No workflow in this repository uses a PAT or a GitHub App token.
# The pull request is opened with GITHUB_TOKEN. GitHub does not start
# other workflows from events that token creates, so the pull request
# body tells a maintainer to close and reopen it. That human event runs
# the six required checks. Branch protection is unchanged.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-citations
  cancel-in-progress: false

jobs:
  refresh:
    name: re-probe citations and open a pull request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Probe every citation fresh, report only
        run: |
          rm -f .ref-cache.json
          python3 tools/validate-refs.py --timeout 25 || true
      - name: Record whether the citation cache changed
        id: cache
        run: |
          set -euo pipefail
          # validate-refs.py writes JSON with no trailing newline. The committed
          # cache has one. Restore it so an identical status map is not a diff.
          if [ -s .ref-cache.json ] && [ -n "$(tail -c1 .ref-cache.json)" ]; then
            printf '\n' >> .ref-cache.json
          fi
          if [ -z "$(git status --porcelain -- .ref-cache.json)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Citation cache matches main. No pull request."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Citation cache differs from main."
          fi
      - name: Open or update the citation cache pull request
        id: cpr
        if: steps.cache.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ github.token }}
          base: main
          branch: automation/refresh-citations
          add-paths: .ref-cache.json
          commit-message: "chore: weekly citation cache refresh"
          committer: "patterns-bot <actions@github.com>"
          author: "patterns-bot <actions@github.com>"
          title: "chore: weekly citation cache refresh"
          body: |
            Weekly re-probe of every citation. This pull request updates `.ref-cache.json` only.

            The probe records the status it observed, including 403 and 429 responses. Those statuses do not fail this workflow.

            ## Required checks

            This pull request is opened with the workflow `GITHUB_TOKEN`. Events created by `GITHUB_TOKEN` do not start other workflows. GitHub skips `pull_request` and `push` runs in that case so a workflow cannot trigger itself. The required status checks on `main` therefore stay pending when this pull request is opened or updated:

            - structure and prose
            - code samples compile
            - citations resolve
            - markdown style
            - claim check
            - PR security check

            No workflow in this repository references a personal access token or a GitHub App token. Either token would open the pull request as a different actor, and the checks would start on their own. Nothing is wired up for that, so this workflow uses `GITHUB_TOKEN` and does not depend on a secret that is not configured.

            A person with write access closes this pull request and reopens it. The reopen is that person's event, so the existing `gates` and `no-ai-attribution` workflows run on this head commit. `pull_request` is the event that starts every required check. Claim check and PR security check run only for that event, so a `workflow_dispatch` of `gates` would leave those two pending. Branch protection is unchanged: merge stays blocked until those six checks pass.

            Close and reopen again after a later weekly run pushes a new commit. This workflow does not close or reopen the pull request itself. That event would still come from `GITHUB_TOKEN`, and the checks would still not start.

            The repository setting "Allow GitHub Actions to create and approve pull requests" must be enabled, or this job cannot open the pull request.
      - name: Report the pull request
        if: steps.cache.outputs.changed == 'true'
        env:
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }} # BESTPRACTICE_OK: action output via env, never inlined into run:
          PR_OPERATION: ${{ steps.cpr.outputs.pull-request-operation }} # BESTPRACTICE_OK: action output via env, never inlined into run:
        run: |
          set -euo pipefail
          echo "Pull request ${PR_OPERATION}: ${PR_URL}"
          echo "A person with write access closes and reopens the pull request so the required checks run."
